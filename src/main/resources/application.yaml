server:
    port: 8081

spring:
    application:
        name: emergency-service

    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erads_emergency_service_db}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        properties:
            "[jakarta.persistence.schema-generation]":
                scripts:
                    action: create
                    create-target: src/main/resources/db/migration/V1__init_emergency_schema.sql

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/